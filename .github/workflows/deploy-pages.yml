name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - feature/zde-deps
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.157.0'
          extended: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python3 -m pip install --upgrade pip pyyaml

      - name: Generate category content
        run: python3 assets/scripts/generate_category_pages.py

      - name: Build site
        run: hugo

      - name: Deploy site
        id: deploy
        uses: ./.github/actions/deploy-pages
        with:
          deploy-path: _site/
