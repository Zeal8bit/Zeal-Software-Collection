name: Community TF image

on:
  push:
    branches: [main, feature/community-image]
    paths:
      - collection.yml
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: community-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      changed: ${{ steps.inputs.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install builder prerequisites
        run: python3 -m pip install 'PyYAML==6.0.3'
      - name: Restore last successful build inputs
        uses: actions/cache/restore@v4
        with:
          path: tmp/community-inputs/baseline.json
          enableCrossOsArchive: true
          key: community-inputs-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            community-inputs-v1-
      - name: Check upstream commits and build inputs
        id: inputs
        run: python3 assets/scripts/community_inputs.py
      - name: Test community image scripts
        if: steps.inputs.outputs.changed == 'true'
        run: python3 -m unittest discover -s tests -v
      - name: Build and verify community image
        if: steps.inputs.outputs.changed == 'true'
        run: python3 assets/scripts/build_community_image.py --no-cache
      - name: Attach checked build inputs
        if: steps.inputs.outputs.changed == 'true'
        run: |
          if [ -f tmp/community-inputs/current.json ]; then
            cp tmp/community-inputs/current.json dist/community/build-inputs.json
          fi
      - name: Save image and build diagnostics
        if: always() && steps.inputs.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: community-image
          path: dist/community/
          if-no-files-found: warn
          retention-days: 14

  publish:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: community-image
          path: dist/community
      - name: Publish main image or create branch draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT")
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            args+=(--draft)
          fi
          python3 assets/scripts/publish_community_image.py "${args[@]}"
      - name: Record successful build inputs
        id: inputs
        run: python3 assets/scripts/community_inputs.py --record --current dist/community/build-inputs.json
      - name: Cache successful build inputs
        if: steps.inputs.outputs.recorded == 'true'
        uses: actions/cache/save@v4
        with:
          path: tmp/community-inputs/baseline.json
          enableCrossOsArchive: true
          key: community-inputs-v1-${{ github.run_id }}-${{ github.run_attempt }}
