version: 1
dependencies:
  # Entries use the ZDE deps schema, with README sections mapped into metadata.category.
  # Links that point at a subdirectory or tagged tree are normalized into a cloneable repo URL.
  #
  # Entries are of the form:
  # - id: <unique identifier, typically "owner/repo" or "owner/repo/subdir">
  #   repo: <git repository URL, optionally with a subdirectory or tag>
  #   branch: <optional branch to use instead of default>
  #   tag: <optional tag to use instead of default>
  #   build: <optional build instructions, either a boolean or an object with tool-specific fields>
  #   depends_on: <optional list of other entries this one depends on, by id>
  #   metadata:
  #     name: <human-friendly name>
  #     category: <list of categories this entry belongs to, e.g. "game", "demo", "software", "language", "development-tool", "library", "core", "extra", "hardware">
  #     description: <short description of the project>
  #     author:
  #       name: <author name>
  #         link: <optional link to author profile>
  #     flags: <optional list of flags, e.g. "work_in_progress", "deprecated", "hardware_extension">
  #   aliases: <optional list of alternative identifiers/names for this entry, or common abbreviations>

